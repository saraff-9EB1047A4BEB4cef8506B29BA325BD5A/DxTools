name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: powershell
        run: dotnet restore DxTools.sln

      - name: Build, test and package
        shell: powershell
        run: .\build\build.ps1 -Configuration Release -ProductVersion 0.12.0

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: DxTools-msi
          path: artifacts/*.msi
          if-no-files-found: error

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: DxTools-publish
          path: artifacts/publish/
          if-no-files-found: error
